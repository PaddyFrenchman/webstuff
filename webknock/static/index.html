<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/knockout@3.5.1/build/output/knockout-latest.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.4.0/dist/axios.min.js"></script>
</head>
<!-- 
inestigate this to load partial html
ko.components.register('my-component', {
    viewModel: { /* ... */ },
    template: { fromUrl: 'path-to-template.html' } // with custom loader
}); 

-->
<body>
    <div id="app" class="container mt-5">
        <!-- Login Screen -->
        <div data-bind="visible: currentView() === 'login'">
            <h2>Login</h2>
            <div class="mb-3">
                <label for="loginUsername" class="form-label">Username</label>
                <input type="text" class="form-control" id="loginUsername" data-bind="value: loginUsername">
            </div>
            <div class="mb-3">
                <label for="loginPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="loginPassword" data-bind="value: loginPassword">
            </div>
            <button class="btn btn-primary" data-bind="click: login">Login</button>
            <button class="btn btn-link" data-bind="click: switchToRegister">Register</button>
        </div>

        <!-- Registration Screen -->
        <div data-bind="visible: currentView() === 'register'">
            <h2>Register</h2>
            <div class="mb-3">
                <label for="registerUsername" class="form-label">Username</label>
                <input type="text" class="form-control" id="registerUsername" data-bind="value: registerUsername">
            </div>
            <div class="mb-3">
                <label for="registerPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="registerPassword" data-bind="value: registerPassword">
            </div>
            <button class="btn btn-primary" data-bind="click: register">Register</button>
            <button class="btn btn-link" data-bind="click: switchToLogin">Back to Login</button>
        </div>

        <!-- Books Screen -->
        <div data-bind="visible: currentView() === 'books'">
            <h2>Books</h2>
            <button class="btn btn-primary mb-3" data-bind="click: logout">Logout</button>
            <button class="btn btn-primary mb-3" data-bind="click: switchToMembers">View Members</button>
            <div class="mb-3">
                <label for="filterStatus" class="form-label">Filter</label>
                <select class="form-select" id="filterStatus" data-bind="value: filterStatus, event: { change: loadBooks }">
                    <option value="">All</option>
                    <option value="available">Available</option>
                    <option value="borrowed">Borrowed</option>
                </select>
            </div>
            <table class="table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody data-bind="foreach: books">
                    <tr>
                        <td data-bind="text: title"></td>
                        <td data-bind="text: author"></td>
                        <td data-bind="text: status"></td>
                        <td>
                            <button class="btn btn-sm btn-primary" data-bind="click: $parent.editBook">Edit</button>
                            <button class="btn btn-sm btn-danger" data-bind="click: $parent.deleteBook">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
            <h3 data-bind="visible: !editingBook()">Add Book</h3>
            <h3 data-bind="visible: editingBook()">Edit Book</h3>
            <div class="mb-3">
                <label for="bookTitle" class="form-label">Title</label>
                <input type="text" class="form-control" id="bookTitle" data-bind="value: newBookTitle">
            </div>
            <div class="mb-3">
                <label for="bookAuthor" class="form-label">Author</label>
                <input type="text" class="form-control" id="bookAuthor" data-bind="value: newBookAuthor">
            </div>
            <button class="btn btn-primary" data-bind="click: saveBook, text: editingBook() ? 'Update' : 'Add'"></button>
        </div>

        <!-- Members Screen -->
        <div data-bind="visible: currentView() === 'members'">
            <h2>Members</h2>
            <button class="btn btn-primary mb-3" data-bind="click: logout">Logout</button>
            <button class="btn btn-primary mb-3" data-bind="click: switchToBooks">View Books</button>
            <table class="table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody data-bind="foreach: members">
                    <tr>
                        <td data-bind="text: name"></td>
                        <td>
                            <button class="btn btn-sm btn-primary" data-bind="click: $parent.editMember">Edit</button>
                            <button class="btn btn-sm btn-danger" data-bind="click: $parent.deleteMember">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
            <h3 data-bind="visible: !editingMember()">Add Member</h3>
            <h3 data-bind="visible: editingMember()">Edit Member</h3>
            <div class="mb-3">
                <label for="memberName" class="form-label">Name</label>
                <input type="text" class="form-control" id="memberName" data-bind="value: newMemberName">
            </div>
            <button class="btn btn-primary" data-bind="click: saveMember, text: editingMember() ? 'Update' : 'Add'"></button>
            <h3>Borrow Book</h3>
            <div class="mb-3">
                <label for="borrowBook" class="form-label">Book</label>
                <select class="form-select" id="borrowBook" data-bind="options: books, optionsText: 'title', optionsValue: 'id', value: selectedBook"></select>
            </div>
            <div class="mb-3">
                <label for="borrowMember" class="form-label">Member</label>
                <select class="form-select" id="borrowMember" data-bind="options: members, optionsText: 'name', optionsValue: 'id', value: selectedMember"></select>
            </div>
            <button class="btn btn-primary" data-bind="click: borrowBook">Borrow</button>
            <h3>Return Book</h3>
            <div class="mb-3">
                <label for="returnBook" class="form-label">Book</label>
                <select class="form-select" id="returnBook" data-bind="options: books, optionsText: 'title', optionsValue: 'id', value: selectedBook"></select>
            </div>
            <div class="mb-3">
                <label for="returnMember" class="form-label">Member</label>
                <select class="form-select" id="returnMember" data-bind="options: members, optionsText: 'name', optionsValue: 'id', value: selectedMember"></select>
            </div>
            <button class="btn btn-primary" data-bind="click: returnBook">Return</button>
        </div>
    </div>

    <script src="static/js/app.js"></script>
</body>
</html>
